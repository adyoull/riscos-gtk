# A port's build on GitHub, in the riscos-crossdev container image.
# riscos-gtk's build on GitHub (copied from riscos-crossdev v1.8.2's ci/). The image
# is the one for the riscos-crossdev release named in .riscos-deps at the
# top of the repository (a line `riscos-crossdev v1.8`; see
# riscos-deps-update.yml). Change BUILD to your build and test command, and
# ARTIFACTS to what it makes. PACKAGES: Ubuntu packages your build needs
# that the image hasn't (docker/Dockerfile lists what it has); set the same
# in riscos-deps-update.yml.
#
# From riscos-crossdev's ci/ (docs/CI.md). MIT licence.
name: RISC OS build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the libraries, GTKTest and GTKHello, the Linux (QEMU) tests, the devkit
  BUILD: make deps tests hello check sdk
  ARTIFACTS: |
    out/*.zip
    out/sdk/*.tar.gz
  # the icon drawing (Pillow), the MIME database (update-mime-database),
  # GTK's resources (gdk-pixbuf-pixdata)
  PACKAGES: "python3-pil shared-mime-info libgdk-pixbuf2.0-bin autoconf-archive"

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: pin
        run: |
          v=$(awk '$1 == "riscos-crossdev" || $1 == "adyoull/riscos-crossdev" {sub(/^v/, "", $2); print $2}' .riscos-deps)
          [ -n "$v" ] || { echo ".riscos-deps has no riscos-crossdev line" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: pin
    runs-on: ubuntu-24.04
    container: ghcr.io/adyoull/riscos-crossdev:${{ needs.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      # the upstream tarballs (build/fetch-sources.sh checks their sha256)
      - uses: actions/cache@v4
        with:
          path: dl
          key: riscos-gtk-dl-${{ hashFiles('build/SHA256SUMS.txt') }}
          restore-keys: riscos-gtk-dl-
      - name: Packages this port needs
        if: env.PACKAGES != ''
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends $PACKAGES
      - name: Build, check and test
        run: ${{ env.BUILD }}
      - uses: actions/upload-artifact@v7
        with:
          name: riscos-build
          path: ${{ env.ARTIFACTS }}
          if-no-files-found: warn
